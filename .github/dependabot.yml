version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    open-pull-requests-limit: 3
    groups:
      maven-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # The client major has to match the Elasticsearch server major.
      - dependency-name: "co.elastic.clients:elasticsearch-java"
        update-types: ["version-update:semver-major"]
      # A Spring Boot major is a migration, not a version bump.
      - dependency-name: "org.springframework.boot:*"
        update-types: ["version-update:semver-major"]
      # springdoc majors follow Spring Boot majors.
      - dependency-name: "org.springdoc:*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    open-pull-requests-limit: 2
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
